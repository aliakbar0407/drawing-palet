function kopCard(){return `<div class="card"><h2>Kop surat</h2><div class="grid">${I('Nama perusahaan (kop atas)','data-kop="name"',K.name,'type=text')}${I('Judul gambar','data-kop="title"',K.title,'type=text')}<label class="wide">Alamat / footer (satu alamat per baris, maksimal 4 baris)<textarea rows="5" data-kop="addr">${esc(K.addr)}</textarea></label><label>Logo kiri atas<input type="file" accept="image/*" onchange="logo('L',this)"></label><label>Logo kanan atas<input type="file" accept="image/*" onchange="logo('R',this)"></label></div>${K.logoL?`<button class="s" onclick="K.logoL='';saveK();ui()">Hapus logo kiri</button>`:''}${K.logoR?`<button class="s" onclick="K.logoR='';saveK();ui()">Hapus logo kanan</button>`:''}<small>Kop dan logo disimpan di perangkat ini dan dipakai di semua gambar.</small></div>`}
function logo(side,inp){const fl=inp.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);K['logo'+side]=c.toDataURL('image/png');saveK();ui()};im.src=r.result};r.readAsDataURL(fl)}
function histCard(){const a=hist();return `<div class="card"><h2>Riwayat gambar</h2>${curId?'<small>Sedang membuka gambar dari riwayat: tombol Simpan akan memperbarui entri ini.</small>':''}<div class="row" style="margin-top:8px"><button onclick="saveDraw(true)">Simpan sebagai baru</button></div>`+(a.length?a.map(x=>`<div class="hi"><div><b>${esc(x.name)}</b><small>${new Date(x.t).toLocaleString('id-ID')}</small></div><div class="hb"><button class="s" onclick="openDraw('${x.id}')">Buka</button><button class="s" onclick="delDraw('${x.id}')">Hapus</button></div></div>`).join(''):'<small style="margin-top:10px">Belum ada gambar tersimpan. Tekan Simpan di bawah gambar.</small>')+'</div>'}
function saveDraw(asNew){const a=hist(),m=model(),snap=JSON.parse(JSON.stringify(S)),name=`${S.cust} · ${f(m.A)} x ${f(m.B)} x ${f(m.H)} cm`,i=a.findIndex(x=>x.id==curId);
 if(i>=0&&!asNew)a[i]={...a[i],t:Date.now(),name,data:snap};else{curId=Date.now().toString(36);a.unshift({id:curId,t:Date.now(),name,data:snap})}
 setHist(a);msg('Tersimpan ke riwayat ✓');if(TAB=='riwayat')ui()}
function openDraw(id){const x=hist().find(v=>v.id==id);if(!x)return;S=Object.assign(fresh(),JSON.parse(JSON.stringify(x.data)));curId=id;TAB='umum';ui();msg('Gambar dibuka dari riwayat')}
function delDraw(id){if(!confirm('Hapus gambar ini dari riwayat?'))return;setHist(hist().filter(x=>x.id!=id));if(curId==id)curId=null;ui()}
function addItem(k){const it=S.L[k].items,l=it[it.length-1];it.push({...l,n:1,slots:''});ui()}
function delItem(k,i){S.L[k].items.splice(i,1);ui()}
function preset(v){if(!v)return;S=fresh();curId=null;const L=S.L,c=S.cust;
 if(v=='p1'){S.A=0;S.B=0;L.atas.items=[IT('2x10x120',7),IT('2x8x120',2,{slots:'3,7',color:'#c9a227'})];L.balok.items[0].spec='5x10x100';L.bawah.items[0].spec='2x10x120'}
 if(v=='p2'){S.A=0;S.B=0;L.atas.items=[IT('2x14x120',2,{slots:'1,9',color:'#d4a017'}),IT('2x10x120',5),IT('2x8x120',2,{slots:'4,6',color:'#c9a227'})];L.balok.items[0].spec='5x10x100';L.bawah.items[0].spec='2x10x120'}
 if(v=='dadu'){L.balok.bm='grid';L.balok.ord='twl';L.balok.items=[IT('8x10x15',6,{slots:'1,3',color:'#6b4f2a'}),IT('8x10x10',3,{slots:'2',color:'#8a6a3d'})]}
 if(v=='dadu2'){S.nailTxt='Paku biasa 2.5"';L.atas.along='Y';L.atas.items=[IT('2x10x110',9)];L.apit.on=1;L.apit.along='X';L.apit.items=[IT('2x10x110',3,{color:'#8b6a2f'})];L.balok.bm='grid';L.balok.ord='twl';L.balok.items=[IT('8x10x10',9,{color:'#6b4f2a'})];L.bawah.along='apit';L.bawah.items=[IT('2x10x110',3,{color:'#e6c08f'})]}
 if(v=='coak'){S.A=0;S.B=0;L.balok.items[0].spec='5x9x122';L.balok.coak='20,82';L.atas.items=[IT('2x9.5x100',9)];L.atas.along='X';L.bawah.items=[IT('2x9.5x100',3,{color:'#e6c08f'})]}
 ui()}
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.kop!==undefined){K[d.kop]=t.value;saveK();draw();return}if(d.p===undefined&&d.l===undefined)return;
 const v=t.type=='checkbox'?(t.checked?1:0):t.type=='number'?(parseFloat(t.value)||0):t.value;
 if(d.p!==undefined)S[d.p]=['A','B','az','el'].includes(d.p)?+v:v;
 else if(d.i!==undefined)S.L[d.l].items[d.i][d.k]=v;else S.L[d.l][d.k]=v;
 if(d.k=='bm'||d.p=='mode')ui();else draw()});
function img(cb){const im=new Image(),c=document.createElement('canvas');c.width=1600;c.height=2260;
 im.onload=()=>{const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1600,2260);x.drawImage(im,0,0,1600,2260);cb(c.toDataURL('image/jpeg',.92))};
 im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(sheet().s)}
function exp(t){img(u=>{const fn='drawing-pallet-'+S.cust.replace(/[^a-z0-9]+/gi,'-');
 if(t=='jpg'){const a=document.createElement('a');a.href=u;a.download=fn+'.jpg';a.click()}
 else{try{const d=new window.jspdf.jsPDF('p','mm','a4');d.addImage(u,'JPEG',0,0,210,297);d.save(fn+'.pdf')}catch(e){alert('PDF gagal dimuat, coba JPG.')}}})}
ui();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
